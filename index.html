<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>i know tomorrow</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- SIDEBAR MENU -->
    <div class="sidebar">
        <h1 class="logo">iknowtomorrow</h1>
        <div class="menu-links">
            <button class="menu-btn active" id="nav-feed" onclick="switchPage('feed')">🏠 Feed</button>
            <button class="menu-btn" id="nav-profile" onclick="switchPage('profile')">👤 Profile</button>
            <button class="menu-btn" id="nav-chats" onclick="switchPage('chats')">💬 Chats</button>
        </div>
        <div class="sidebar-user" onclick="switchPage('profile')">
            <img id="sidebarAvatar" class="mini-avatar" src="https://placeholder.com" alt="avatar">
            <div class="user-info">
                <span id="sidebarName">Sainaa</span>
                <small>🔮 Active Now</small>
            </div>
        </div>
    </div>

    <!-- MAIN CONTENT AREA -->
    <div class="content-area">
        <header>
            <div id="searchTagDisplay" style="color:var(--accent); font-weight:bold;"></div>
            <button id="langBtn" onclick="toggleLanguage()">English</button>
        </header>

        <div class="main-container">
            <!-- 1. FEED PAGE -->
            <div id="page-feed" class="page active">
                <div class="feed-box">
                    <select id="userSelect" onchange="updateProfileName()">
                        <option value="Sainaa">Sainaa (Үндсэн Хэрэглэгч)</option>
                        <option value="Anonymous Alien">Anonymous Alien</option>
                    </select>
                    <select id="categorySelect"></select>
                    <textarea id="postInput"></textarea>
                    
                    <!-- МЕДИА ХАВСАРГАХ (ЗУРАГ БА БИЧЛЕГ) -->
                    <div class="file-upload-group" style="display:flex; gap:10px;">
                        <label for="postImageInput" class="file-label">📷 Зураг</label>
                        <input type="file" id="postImageInput" accept="image/*" onchange="previewPostMedia('image')">
                        
                        <label for="postVideoInput" class="file-label" style="background-color:#4facfe;">🎥 Бичлэг</label>
                        <input type="file" id="postVideoInput" accept="video/*" onchange="previewPostMedia('video')">
                    </div>
                    <div id="mediaPreviewContainer"></div>
                    
                    <button id="submitBtn" onclick="createPost()"></button>
                </div>
                <!-- ТАГУУДААР ШҮҮХ ХЭСЭГ -->
                <div style="margin-bottom:15px; display:flex; gap:8px; flex-wrap:wrap;">
                    <button class="lang-btn" onclick="filterByTag('')">🔄 Бүх Пост</button>
                    <button class="lang-btn" onclick="filterByTag('ai')">#ai</button>
                    <button class="lang-btn" onclick="filterByTag('харьгариг')">#харьгариг</button>
                    <button class="lang-btn" onclick="filterByTag('ирээдүй')">#ирээдүй</button>
                    <button class="lang-btn" onclick="filterByTag('зүүд')">#зүүд</button>
                </div>
                <div id="postsContainer"></div>
            </div>

            <!-- 2. PROFILE PAGE -->
            <div id="page-profile" class="page">
                <div class="profile-card">
                    <div class="avatar-container">
                        <img id="profileAvatar" class="avatar" src="https://placeholder.com" alt="avatar">
                        <label for="avatarInput" class="avatar-edit-label">Change</label>
                        <input type="file" id="avatarInput" accept="image/*" style="display:none;" onchange="changeProfileAvatar()">
                    </div>
                    <h2 id="profileName">Sainaa</h2>
                    <p id="profileTitle" style="color: var(--text-sub)">🔮 Ирээдүйг Зөгнөгч Магистр</p>
                </div>
                <h3 id="myPostsTitle">Миний Зөгнөлүүд</h3>
                <div id="myPostsContainer"></div>
            </div>

            <!-- 3. CHATS PAGE -->
            <div id="page-chats" class="page">
                <!-- 🤖 ЗӨВХӨН ЭНД ХАРАГДАХ МЕМОРИ СИНК -->
                <div id="robotSyncPanel" style="background:#2f3b4c; padding:12px; border-radius:12px; margin-bottom:15px; border-left:4px solid var(--accent); display:none;">
                    <span id="robotSyncText">🔮 Роботын ой санамж: 0%</span>
                </div>

                <div style="margin-bottom: 10px;">
                    <label id="chatWithLabel">Хэнтэй чатлах: </label>
                    <select id="chatPartner" onchange="loadChats()">
                        <option value="Future Bot 🤖">Future Bot 🤖</option>
                        <option value="Amaraa (Найз ☄️)">Amaraa (Найз ☄️)</option>
                    </select>
                </div>
                <div class="chat-box">
                    <div class="chat-messages" id="chatMessages"></div>
                    <div class="comment-input-group" style="padding: 10px; background: #121824;">
                        <input type="text" class="comment-input" id="chatInput">
                        <button class="comment-btn" id="chatSendBtn" onclick="sendDirectMessage()"></button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
