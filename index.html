<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>i know tomorrow</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- SIDEBAR MENU -->
    <div class="sidebar">
        <h1 class="logo">iknowtomorrow</h1>
        <div class="menu-links">
            <button class="menu-btn active" id="nav-feed" onclick="switchPage('feed')">🏠 Feed</button>
            <button class="menu-btn" id="nav-profile" onclick="switchPage('profile')">👤 Profile</button>
            <button class="menu-btn" id="nav-chats" onclick="switchPage('chats')">💬 Chats</button>
        </div>
        <div class="sidebar-user" onclick="switchPage('profile')">
            <img id="sidebarAvatar" class="mini-avatar" src="https://placeholder.com" alt="avatar">
            <div class="user-info">
                <span id="sidebarName">Sainaa</span>
                <small>🔮 Active Now</small>
            </div>
        </div>
    </div>

    <!-- MAIN CONTENT AREA -->
    <div class="content-area">
        <header>
            <div class="memory-progress-container">
                <span style="color:#ffb703; font-weight:bold; font-size:0.85rem;">MEMORY SYNC:</span>
                <div class="progress-bar-bg">
                    <div id="globalProgressBar" class="progress-bar-fill" style="width: 0%;"></div>
                </div>
                <span id="progressText" style="color:#ffb703; font-weight:bold; font-size:0.85rem;">0%</span>
            </div>
            <button id="langBtn" onclick="toggleLanguage()">English</button>
        </header>

        <div class="main-container">
            <!-- FEED PAGE -->
            <div id="page-feed" class="page active">
                <div class="feed-box">
                    <select id="userSelect" onchange="updateProfileName()">
                        <option value="Sainaa">Sainaa (Үндсэн Хэрэглэгч)</option>
                        <option value="Anonymous Alien">Anonymous Alien</option>
                    </select>
                    <select id="categorySelect"></select>
                    <textarea id="postInput"></textarea>
                    <div class="file-upload-group">
                        <label for="postImageInput" class="file-label">📷 Зураг нэмэх</label>
                        <input type="file" id="postImageInput" accept="image/*" onchange="previewPostImage()">
                        <img id="postImgPreview" style="display:none; max-width:100px; margin-top:10px; border-radius:8px;">
                    </div>
                    <button id="submitBtn" onclick="createPost()"></button>
                </div>
                <div id="postsContainer"></div>
            </div>

            <!-- PROFILE PAGE -->
            <div id="page-profile" class="page">
                <div class="profile-card">
                    <div class="avatar-container">
                        <img id="profileAvatar" class="avatar" src="https://placeholder.com" alt="avatar">
                        <label for="avatarInput" class="avatar-edit-label">Change</label>
                        <input type="file" id="avatarInput" accept="image/*" style="display:none;" onchange="changeProfileAvatar()">
                    </div>
                    <h2 id="profileName">Sainaa</h2>
                    <p id="profileTitle" style="color: var(--text-sub)">🔮 Ирээдүйг Зөгнөгч Магистр</p>
                </div>
                <h3 id="myPostsTitle">Миний Зөгнөлүүд</h3>
                <div id="myPostsContainer"></div>
            </div>

            <!-- CHATS PAGE (ЗЭРЭГЦЭЭ 2 ЦОНХТОЙ БҮТЭЦ) -->
            <div id="page-chats" class="page">
                <div class="dual-chat-container">
                    <!-- ЗҮҮН ЦОНХ: РОБОТТОЙ ЧАТЛАХ -->
                    <div class="chat-window-pane">
                        <div class="pane-header">🤖 [ERR_ID_2040]</div>
                        <div class="chat-box">
                            <div class="chat-messages" id="chatMessages"></div>
                            <div class="comment-input-group" style="padding: 10px; background: #1a1e24;">
                                <input type="text" class="comment-input" id="chatInput" onkeypress="handleChatKey(event)">
                                <button class="comment-btn" id="chatSendBtn" onclick="sendDirectMessage()"></button>
                            </div>
                        </div>
                    </div>
                    <!-- БАРУУН ЦОНХ: ОЙ САНАМЖИЙН ХАВТАС -->
                    <div class="chat-window-pane">
                        <div class="pane-header">📂 MEMORY LOGS</div>
                        <div class="log-box" id="memoryLogs">
                            <div class="log-entry system">[SYSTEM_READY] Роботын системийг сэргээхийн тулд нууц үгнүүдийг чат дээр тааж бичнэ үү.</div>
                            <div class="log-entry code-hint">Хөлөг онгоцны нууц код: ??2??6</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
