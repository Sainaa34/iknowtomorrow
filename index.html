<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>i know tomorrow - Ирээдүйг Зөгнөх Платформ</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #1f2833;
            --text-main: #ffffff;
            --text-sub: #c5a1ff;
            --accent: #00f2fe;
            --accent-pink: #4facfe;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 550px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            margin-top: 10px;
            box-sizing: border-box;
        }

        header h1 {
            font-family: 'Fredoka', cursive;
            background: linear-gradient(45deg, var(--accent), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            font-size: 1.8rem;
            letter-spacing: 1px;
        }

        /* Хэл солих товчлуур */
        .lang-btn {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            transition: 0.2s;
        }

        .lang-btn:hover {
            background-color: var(--accent);
            color: #000;
        }

        .main-container {
            width: 90%;
            max-width: 550px;
            margin-bottom: 50px;
        }

        .feed-box {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            border: 1px solid #2f3b4c;
        }

        .feed-box h3 {
            margin-top: 0;
            font-size: 1.1rem;
            color: #afb3b8;
        }

        .category-select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            background-color: #0b0c10;
            color: white;
            border: 1px solid var(--accent);
            margin-bottom: 12px;
            font-size: 0.95rem;
        }

        textarea {
            width: 100%;
            height: 90px;
            background-color: #121824;
            border: 1px solid #2f3b4c;
            border-radius: 8px;
            color: white;
            padding: 12px;
            box-sizing: border-box;
            resize: none;
            font-size: 1rem;
            margin-bottom: 12px;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .submit-btn:hover {
            transform: scale(1.01);
            opacity: 0.9;
        }

        .post {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 15px;
            border: 1px solid #2f3b4c;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .badge {
            background-color: #ff007f;
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .post-time {
            font-size: 0.8rem;
            color: #8a8d91;
        }

        .post-content {
            font-size: 1.05rem;
            line-height: 1.5;
            white-space: pre-wrap;
            margin-bottom: 15px;
        }

        .comment-section {
            border-top: 1px solid #2f3b4c;
            padding-top: 10px;
        }

        .comment-list {
            margin-bottom: 10px;
        }

        .comment-item {
            background-color: #121824;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 5px;
            color: #e4e6eb;
        }

        .comment-input-group {
            display: flex;
            gap: 8px;
        }

        .comment-input {
            flex: 1;
            background-color: #121824;
            border: 1px solid #2f3b4c;
            border-radius: 6px;
            color: white;
            padding: 6px 10px;
            font-size: 0.9rem;
        }

        .comment-btn {
            background-color: #3a3b3c;
            color: white;
            border: none;
            padding: 0 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>iknowtomorrow.com</h1>
        <!-- Хэл солих товчлуур -->
        <button id="langBtn" class="lang-btn" onclick="toggleLanguage()">English</button>
    </header>

    <div class="main-container">
        <div class="feed-box">
            <h3 id="titleText">✨ Маргаашийг зөгнөн бичээрэй...</h3>
            <select id="categorySelect" class="category-select"></select>
            <textarea id="postInput" placeholder="Ирээдүйд юу болох бол? Энд хуваалц..."></textarea>
            <button id="submitBtn" class="submit-btn" onclick="createPost()">Нийтлэх</button>
        </div>

        <div id="postsContainer"></div>
    </div>

    <script>
        // Хэлний орчуулгын өгөгдөл
        const translations = {
            mn: {
                title: "✨ Маргаашийг зөгнөн бичээрэй...",
                placeholder: "Ирээдүйд юу болох бол? Энд хуваалц...",
                submit: "Нийтлэх",
                commentPlaceholder: "Сэтгэгдэл бичих...",
                send: "Илгээх",
                alert: "Зөгнөлөө бичнэ үү, андаа!",
                categories: [
                    "🤖 Хиймэл оюун ухаан (AI)",
                    "🚀 Ирээдүйн Технологи",
                    "🔮 Зүүд ба Зөн совин",
                    "👽 Харийн гариг",
                    "🦾 Хиймэл эрхтэн / Киборг"
                ]
            },
            en: {
                title: "✨ Predict tomorrow...",
                placeholder: "What will happen in the future? Share here...",
                submit: "Post",
                commentPlaceholder: "Write a comment...",
                send: "Send",
                alert: "Please write your prediction first!",
                categories: [
                    "🤖 Artificial Intelligence (AI)",
                    "🚀 Future Technology",
                    "🔮 Dreams & Intuition",
                    "👽 Aliens & Outer Space",
                    "🦾 Artificial Organs / Cyborg"
                ]
            }
        };

        let currentLang = localStorage.getItem('iknow_lang') || 'mn';

        document.addEventListener('DOMContentLoaded', () => {
            updateLanguageUI();
            loadPosts();
        });

        function toggleLanguage() {
            currentLang = currentLang === 'mn' ? 'en' : 'mn';
            localStorage.setItem('iknow_lang', currentLang);
            updateLanguageUI();
            renderPosts();
        }

        function updateLanguageUI() {
            const t = translations[currentLang];
            document.getElementById('langBtn').innerText = currentLang === 'mn' ? 'English' : 'Монгол';
            document.getElementById('titleText').innerText = t.title;
            document.getElementById('postInput').placeholder = t.placeholder;
            document.getElementById('submitBtn').innerText = t.submit;

            // Төрлүүдийг шинэчлэх
            const select = document.getElementById('categorySelect');
            const savedValue = select.value;
            select.innerHTML = '';
            t.categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.innerText = cat;
                select.appendChild(opt);
            });
        }

        function createPost() {
            const content = document.getElementById('postInput').value.trim();
            const category = document.getElementById('categorySelect').value;
            
            if(!content) {
                alert(translations[currentLang].alert);
                return;
            }

            const newPost = {
                id: Date.now(),
                category: category,
                content: content,
                time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                comments: []
            };

            let posts = JSON.parse(localStorage.getItem('iknow_posts')) || [];
            posts.unshift(newPost);
            localStorage.setItem('iknow_posts', JSON.stringify(posts));

            document.getElementById('postInput').value = '';
            renderPosts();
        }

        function loadPosts() {
