<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>i know tomorrow</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ФЭЙСБҮҮК ШИГ ЗҮҮН ТАЛЫН ЦЭС (SIDEBAR) -->
    <div class="sidebar">
        <h1 class="logo">iknowtomorrow</h1>
        
        <div class="menu-links">
            <button class="menu-btn active" id="nav-feed" onclick="switchPage('feed')">🏠 Feed</button>
            <button class="menu-btn" id="nav-profile" onclick="switchPage('profile')">👤 Profile</button>
            <button class="menu-btn" id="nav-chats" onclick="switchPage('chats')">💬 Chats</button>
        </div>

        <!-- ЦЭСНИЙ ДООР ХАРАГДАХ ПРОФАЙЛ ХЭСЭГ -->
        <div class="sidebar-user" onclick="switchPage('profile')">
            <div class="mini-avatar"></div>
            <div class="user-info">
                <span id="sidebarName">Sainaa</span>
                <small>🔮 Active Now</small>
            </div>
        </div>
    </div>

    <!-- ҮНДСЭН КОНТЕНТ ХАРАГДАХ ХЭСЭГ -->
    <div class="content-area">
        <header>
            <div></div> <!-- Тэнцвэржүүлэгч -->
            <button id="langBtn" onclick="toggleLanguage()">English</button>
        </header>

        <div class="main-container">
            <!-- FEED PAGE -->
            <div id="page-feed" class="page active">
                <div class="feed-box">
                    <select id="userSelect" onchange="updateProfileName()">
                        <option value="Sainaa">Sainaa (Үндсэн Хэрэглэгч)</option>
                        <option value="Anonymous Alien">Anonymous Alien</option>
                    </select>
                    <select id="categorySelect"></select>
                    <textarea id="postInput"></textarea>
                    <button id="submitBtn" onclick="createPost()"></button>
                </div>
                <div id="postsContainer"></div>
            </div>

            <!-- PROFILE PAGE -->
            <div id="page-profile" class="page">
                <div class="profile-card">
                    <div class="avatar"></div>
                    <h2 id="profileName">Sainaa</h2>
                    <p id="profileTitle" style="color: var(--text-sub)">🔮 Ирээдүйг Зөгнөгч Магистр</p>
                </div>
                <h3 id="myPostsTitle">Миний Зөгнөлүүд</h3>
                <div id="myPostsContainer"></div>
            </div>

            <!-- CHATS PAGE -->
            <div id="page-chats" class="page">
                <div style="margin-bottom: 10px;">
                    <label id="chatWithLabel">Хэнтэй чатлах: </label>
                    <select id="chatPartner" onchange="loadChats()">
                        <option value="Future Bot 🤖">Future Bot 🤖</option>
                        <option value="Amaraa (Найз ☄️)">Amaraa (Найз ☄️)</option>
                    </select>
                </div>
                <div class="chat-box">
                    <div class="chat-messages" id="chatMessages"></div>
                    <div class="comment-input-group" style="padding: 10px; background: #121824;">
                        <input type="text" class="comment-input" id="chatInput">
                        <button class="comment-btn" id="chatSendBtn" onclick="sendDirectMessage()"></button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
