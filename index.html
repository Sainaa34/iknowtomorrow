<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>i know tomorrow - Ирээдүйг Зөгнөх Платформ</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #1f2833;
            --text-main: #ffffff;
            --text-sub: #c5a1ff;
            --accent: #00f2fe;
            --accent-pink: #4facfe;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 600px;
            text-align: center;
            padding: 20px 0;
            margin-top: 10px;
        }

        header h1 {
            font-family: 'Fredoka', cursive;
            background: linear-gradient(45deg, var(--accent), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            font-size: 2.2rem;
            letter-spacing: 1px;
        }

        .main-container {
            width: 90%;
            max-width: 550px;
            margin-bottom: 50px;
        }

        /* Пост хийх хэсэг (Фэйсбүүк шиг) */
        .feed-box {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            border: 1px solid #2f3b4c;
        }

        .feed-box h3 {
            margin-top: 0;
            font-size: 1.1rem;
            color: #afb3b8;
        }

        .category-select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            background-color: #0b0c10;
            color: white;
            border: 1px solid #45f3ff;
            margin-bottom: 12px;
            font-size: 0.95rem;
        }

        textarea {
            width: 100%;
            height: 90px;
            background-color: #121824;
            border: 1px solid #2f3b4c;
            border-radius: 8px;
            color: white;
            padding: 12px;
            box-sizing: border-box;
            resize: none;
            font-size: 1rem;
            margin-bottom: 12px;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .submit-btn:hover {
            transform: scale(1.01);
            opacity: 0.9;
        }

        /* Постууд харагдах хэсэг */
        .post {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 15px;
            border: 1px solid #2f3b4c;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .badge {
            background-color: #ff007f;
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .post-time {
            font-size: 0.8rem;
            color: #8a8d91;
        }

        .post-content {
            font-size: 1.05rem;
            line-height: 1.5;
            white-space: pre-wrap;
            margin-bottom: 15px;
        }

        /* Сэтгэгдлийн хэсэг */
        .comment-section {
            border-top: 1px solid #2f3b4c;
            padding-top: 10px;
        }

        .comment-list {
            margin-bottom: 10px;
        }

        .comment-item {
            background-color: #121824;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 5px;
            color: #e4e6eb;
        }

        .comment-input-group {
            display: flex;
            gap: 8px;
        }

        .comment-input {
            flex: 1;
            background-color: #121824;
            border: 1px solid #2f3b4c;
            border-radius: 6px;
            color: white;
            padding: 6px 10px;
            font-size: 0.9rem;
        }

        .comment-btn {
            background-color: #3a3b3c;
            color: white;
            border: none;
            padding: 0 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .comment-btn:hover { background-color: #4e4f50; }
    </style>
</head>
<body>

    <header>
        <h1>iknowtomorrow.com</h1>
    </header>

    <div class="main-container">
        <!-- Пост оруулах талбар -->
        <div class="feed-box">
            <h3>✨ Маргаашийг зөгнөн бичээрэй...</h3>
            <select id="categorySelect" class="category-select">
                <option value="🤖 Хиймэл оюун ухаан (AI)">🤖 Хиймэл оюун ухаан (AI)</option>
                <option value="🚀 Ирээдүйн Технологи">🚀 Ирээдүйн Технологи</option>
                <option value="🔮 Зүүд ба Зөн совин">🔮 Зүүд ба Зөн совин</option>
                <option value="👽 Харийн гариг">👽 Харийн гариг</option>
                <option value="🦾 Хиймэл эрхтэн / Киборг">🦾 Хиймэл эрхтэн / Киборг</option>
            </select>
            <textarea id="postInput" placeholder="Ирээдүйд юу болох бол? Энд хуваалц..."></textarea>
            <button class="submit-btn" onclick="createPost()">Нийтлэх</button>
        </div>

        <!-- Постууд энд жагсаана -->
        <div id="postsContainer"></div>
    </div>

    <script>
        // Апп ачаалагдах үед хуучин постуудыг унших
        document.addEventListener('DOMContentLoaded', loadPosts);

        function createPost() {
            const content = document.getElementById('postInput').value.trim();
            const category = document.getElementById('categorySelect').value;
            
            if(!content) {
                alert('Зөгнөлөө бичнэ үү, андаа!');
                return;
            }

            const newPost = {
                id: Date.now(),
                category: category,
                content: content,
                time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                comments: []
            };

            let posts = JSON.parse(localStorage.getItem('iknow_posts')) || [];
            posts.unshift(newPost);
            localStorage.setItem('iknow_posts', JSON.stringify(posts));

            document.getElementById('postInput').value = '';
            renderPosts();
        }

        function loadPosts() {
            // Хэрэв анх удаа орж байвал жишээ пост бэлдэх
            let posts = JSON.parse(localStorage.getItem('iknow_posts'));
            if(!posts) {
                posts = [
                    {
                        id: 1,
                        category: "🤖 Хиймэл оюун ухаан (AI)",
                        content: "2030 он гэхэд хүмүүс өөрийн гэсэн хувийн AI туслахтай болоод, тэр нь өмнөөс нь ажилд нь явдаг болох байх даа. Чи юу гэж бодож байна?",
                        time: "19:45",
                        comments: ["Үнэхээр гоё санаа байна!", "Тэгвэл ч гоё доо хэхэ"]
                    }
                ];
                localStorage.setItem('iknow_posts', JSON.stringify(posts));
            }
            renderPosts();
        }

        function renderPosts() {
            const container = document.getElementById('postsContainer');
            const posts = JSON.parse(localStorage.getItem('iknow_posts')) || [];
            container.innerHTML = '';

            posts.forEach(post => {
                let commentHTML = '';
                post.comments.forEach(c => {
                    commentHTML += `<div class="comment-item">${c}</div>`;
                });

                const postHTML = `
                    <div class="post">
                        <div class="post-header">
                            <span class="badge">${post.category}</span>
                            <span class="post-time">${post.time}</span>
                        </div>
                        <div class="post-content">${post.content}</div>
                        
                        <div class="comment-section">
                            <div class="comment-list">${commentHTML}</div>
                            <div class="comment-input-group">
                                <input type="text" class="comment-input" id="input-${post.id}" placeholder="Сэтгэгдэл бичих...">
                                <button class="comment-btn" onclick="addComment(${post.id})">Илгээх</button>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += postHTML;
            });
        }

        function addComment(postId) {
            const inputField = document.getElementById(`input-${postId}`);
            const text = inputField.value.trim();
            if(!text) return;

            let posts = JSON.parse(localStorage.getItem('iknow_posts')) || [];
