<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iKnowTomorrow - Global Future Network</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-light">
    <!-- 1. SECURE AUTONOMOUS IDENTITY CONTAINER -->
    <div id="auth-container" class="auth-box-matrix">
        
        <!-- LOGIN CONTROL CARD -->
        <div id="login-card" class="auth-card">
            <h2 data-i18n="login_title">Access Future Network</h2>
            <form onsubmit="handleLogin(event)">
                <input type="text" id="login-username" placeholder="Username" required>
                <div class="password-wrapper">
                    <input type="password" id="login-password" placeholder="Password" required>
                    <button type="button" onclick="togglePasswordVisibility('login-password')">👁</button>
                </div>
                <button type="submit" class="neon-btn-primary" data-i18n="login_btn">Enter Timeline</button>
            </form>
            <p style="margin-top:24px;">
                <span data-i18n="no_account">New Citizen?</span> 
                <a href="#" onclick="showAuthPage('register')">Create Identity</a>
            </p>
        </div>

        <!-- REGISTER CONTROL CARD -->
        <div id="register-card" class="auth-card" style="display: none;">
            <h2 data-i18n="register_title">Create Neural Identity</h2>
            <form onsubmit="handleRegister(event)">
                <input type="text" id="reg-username" placeholder="Choose Username" required>
                <div class="password-wrapper">
                    <input type="password" id="reg-password" placeholder="Create Access Key" required>
                    <button type="button" onclick="togglePasswordVisibility('reg-password')">👁</button>
                </div>
                <button type="submit" class="neon-btn-primary" data-i18n="register_btn">Register Identity</button>
            </form>
            <p>
                <span data-i18n="have_account">Already registered?</span> 
                <a href="#" onclick="showAuthPage('login')" data-i18n="sign_in">Sign In</a>
            </p>
        </div>
    </div>
    <!-- 2. MAIN CORE APPLICATION NETWORK INTERFACE -->
    <div id="main-app" style="display: none;">
        
        <!-- MASTER HEADER DEPLOYMENT -->
        <header class="main-header">
            <div class="logo-neon" onclick="resetAppToHome()" style="cursor: pointer;">iKnowTomorrow</div>
            <div class="header-right-controls">
                
                <!-- GLOBAL LANGUAGE DROPDOWN CHANNELS -->
                <button id="lang-btn" class="header-action-btn" onclick="toggleLanguageSelector()">🌐 Language: EN</button>
                <div id="lang-dropdown" class="lang-dropdown-box" style="display: none;">
                    <div onclick="changeLanguage('en')">English</div>
                    <div onclick="changeLanguage('mn')">Монгол</div>
                </div>
                <div class="user-session-node" id="trigger-profile-node" onclick="triggerAvatarModal()">
                    <img id="profile-avatar" src="avatar.png" class="header-avatar">
                    <span id="profile-name">Citizen</span>
                </div>
                <button class="disconnect-btn" onclick="handleLogout()" data-i18n="logout_btn">Disconnect</button>
            </div>
        </header>

        <!-- MAIN APPLICATION GRID MATRIX -->
        <div class="app-layout-grid">
            
            <!-- LEFT NAVIGATION SIDEBAR -->
            <aside class="sidebar-left">
                <nav class="sidebar-nav">
                    <button id="feed-btn" class="nav-item active" onclick="switchTab('feed')">
                        <span class="nav-icon">🌐</span> <span data-i18n="nav_feed">Future Feed</span>
                    </button>
                    <button id="chats-btn" class="nav-item" onclick="switchTab('chats')">
                        <span class="nav-icon">💬</span> <span data-i18n="nav_chats">Encrypted Chat</span>
                    </button>
                    <button id="vault-btn" class="nav-item" onclick="switchTab('vault')">
                        <span class="nav-icon">🔒</span> <span data-i18n="nav_vault">Private Vault</span>
                    </button>
                    <button id="ai-btn" class="nav-item" onclick="switchTab('ai')">
                        <span class="nav-icon">🎨</span> <span data-i18n="nav_ai">Artist AI</span>
                    </button>
                </nav>
                <div class="sidebar-footer-theme">
                    <button id="theme-btn" class="sidebar-theme-btn" onclick="toggleTheme()">🎨 Theme: LIGHT</button>
                </div>
            </aside>
<main class="content-viewport">
    <section id="tab-feed" class="tab-content-panel">
        <div class="feed-composer-card">
            <textarea id="future-input" placeholder="Share your vision..."></textarea>
            <div class="composer-actions-row">
                <div class="media-attach-triggers">
                    <label>🖼 Image<input type="file" id="post-image-file" accept="image/*" hidden></label>
                    <label>🎬 Video<input type="file" id="post-video-file" accept="video/*" hidden></label>
                </div>
                <button onclick="createPost()">Publish</button>
            </div>
            <div id="post-media-preview-box" style="display: none;">
                <img id="post-image-preview-img" style="max-width:100%; display:none;">
                <video id="post-video-preview-vid" style="max-width:100%; display:none;" controls></video>
                <button onclick="clearAttachedMedia()">✕</button>
            </div>
        </div>
</main>
        <div class="feed-search-row">
            <input type="text" id="search-input" placeholder="Search Global Network..." oninput="searchPosts()">
        </div>
        <div id="feed-container" class="timeline-stream"></div>
    </section>

    <!-- TAB 2: ENCRYPTED CHATS LAYER -->
    <section id="tab-chats" class="tab-content-panel" style="display: none;">
        <div class="chat-interface-grid">
            <div class="chat-citizens-sidebar">
                <h3 data-i18n="online_citizens">Online Citizens</h3>
                <div id="friends-list-container"></div>
            </div>
            <div class="chat-window-viewport">
                <div id="active-chat-partner" class="chat-window-header">💬 Select citizen to chat</div>
                <div id="friends-chat-messages" class="chat-messages-stream"></div>
                <div class="chat-input-footer">
                    <input type="text" id="friends-chat-input" placeholder="Type encrypted message...">
                    <button class="chat-send-btn" onclick="sendFriendMessage()">➔</button>
                </div>
            </div>
        </div>
    </section>

    <!-- TAB 3: SECURE PRIVATE VAULT LOG -->
    <section id="tab-vault" class="tab-content-panel" style="display: none;">
        <div class="vault-grid-layout">
            <!-- ... Private Vault and Artist AI UI code ... -->
            <div class="vault-form-card">...</div>
            <div class="vault-records-stream">...</div>
        </div>
    </section>

    <section id="tab-ai" class="tab-content-panel" style="display: none;">
        <div class="ai-generator-card">...</div>
    </section>
</main>
</div>
</div>

<!-- 3. PROFILE MODAL -->
<div id="avatar-modal" class="modal-backdrop-overlay" style="display: none;">
    <!-- ... Profile modal UI code ... -->
</div>
<script src="script.js"></script>
</body>
</html>
