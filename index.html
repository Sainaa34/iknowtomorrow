<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>i know tomorrow</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://google.com" async defer></script>
    <style>
        .auth-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #12161a; z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .auth-card { background: #1a1f26; border: 1px solid #ffb703; padding: 30px; border-radius: 16px; box-shadow: 0 0 20px rgba(255,183,3,0.15); width: 320px; text-align: center; position: relative; }
        .auth-input { width: 100%; padding: 10px 15px; margin-bottom: 12px; background: #12161a; border: 1px solid #242b35; border-radius: 8px; color: #fff; box-sizing: border-box; outline: none; font-size: 0.95rem; }
        .auth-input:focus { border-color: #ffb703; }
        .auth-btn { width: 100%; background: #ffb703; color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 10px; font-size: 0.95rem; }
        .auth-btn-sub { width: 100%; background: transparent; color: #ffb703; border: 1px solid #ffb703; padding: 11px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.95rem; margin-bottom: 15px; }
        .guest-btn { background: none; border: none; color: #a0a5b0; cursor: pointer; font-size: 0.85rem; font-weight: 600; text-decoration: underline; margin-top: 15px; display: inline-block; }
        .guest-btn:hover { color: #ffb703; }
        .auth-corner-btn { position: absolute; right: 15px; top: -45px; background: transparent; color: #ffb703; border: 1px solid #ffb703; padding: 5px 12px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 0.8rem; }
        .auth-corner-btn:hover { background: #ffb703; color: #000; }
    </style>
</head>
<body>
    <!-- 🔒 НЭВТРЭХ БА БҮРТГҮҮЛЭХ УХААЛАГ ЦОНХ -->
    <div id="authOverlay" class="auth-overlay">
        <div class="auth-card">
            <button class="auth-corner-btn" id="authLangBtn" type="button" onclick="toggleLanguage()">Монгол</button>
            <h1 style="font-family:'Fredoka',cursive; color:#ffb703; margin:0 0 5px 0; font-size:1.9rem;">iknowtomorrow</h1>
            <p id="authSubText" style="font-size:0.8rem; color:#a0a5b0; margin-bottom:25px; letter-spacing:1px;">🔒 FUTURE CITIZEN LOGIN SYSTEM</p>
            
            
            <input type="password" id="authPassword" class="auth-input" placeholder="Access key (Password)">
            
            <button class="auth-btn" id="loginSubmitBtn" type="button">LOGIN</button>
            <button class="auth-btn-sub" id="signUpSubmitBtn" type="button">REGISTER NEW IDENTITY</button>
            
            <div style="display:flex; justify-content:center; margin-top:10px;" id="g_id_onload"
                 data-client_id="YOUR_GOOGLE_CLIENT_://googleusercontent.com"
                 data-callback="handleGoogleLogin">
            </div>
            <div class="g_id_signin" data-type="standard"></div>
            
            <!-- ЗӨВХӨН СОНИРХОЖ ОРОХ (GUEST MODE) -->
            <button class="guest-btn" id="guestBtn" type="button" onclick="enterAsGuest()">👁️ Browse as Guest (Anonymous)</button>
        </div>
    </div>

    <!-- SIDEBAR MENU -->
    <div class="sidebar">
        <h1 class="logo">iknowtomorrow</h1>
        <div class="menu-links">
            <button class="menu-btn active" id="nav-feed" onclick="switchPage('feed')">🏠 Feed</button>
            <button class="menu-btn" id="nav-myposts" onclick="switchPage('myposts')">📌 My Posts</button>
            <button class="menu-btn" id="nav-friends" onclick="switchPage('friends')">👥 Friends</button>
            <button class="menu-btn" id="nav-chats" onclick="switchPage('chats')">💬 Chats</button>
            <button class="menu-btn" id="nav-profile" onclick="switchPage('profile')">👤 Profile Settings</button>
        </div>
        <div class="sidebar-user">
            <img id="sidebarAvatar" class="mini-avatar" src="https://placeholder.com" alt="avatar">
            <div class="user-info">
                <span id="sidebarName">Sainaa</span>
                <select id="statusSelect" onchange="changeOnlineStatus()">
                    <option value="Active Now">🟢 Active Now</option>
                    <option value="Sleeping">🌙 Sleeping</option>
                    <option value="Offline">🔴 Offline</option>
                </select>
            </div>
            <button onclick="logoutAction()" style="background:none; border:none; color:#ff0055; cursor:pointer; font-size:0.8rem; font-weight:bold; margin-left:5px;">Exit</button>
        </div>
    </div>

    <!-- MAIN CONTENT AREA -->
    <div class="content-area">
        <header>
            <div class="search-bar-container">
                <input type="text" id="globalSearchInput" placeholder="🔍 Хайх (Үг, таг эсвэл нэр...)" oninput="handleGlobalSearch()">
            </div>
            <button id="langBtn" class="corner-lang-btn" onclick="toggleLanguage()">English</button>
        </header>

        <div class="main-container">
            <div id="page-feed" class="page active">
                <div id="searchTagDisplay" style="color:var(--accent); font-weight:bold; margin-bottom:10px;"></div>
                <div id="postsContainer"></div>
            </div>
            <div id="page-myposts" class="page">
                <div class="feed-box" id="myPostWriteBox">
                    <textarea id="postInput" onkeydown="handlePostSubmit(event)" oninput="handleTagSuggestions(event)"></textarea>
                    <div id="tagSuggestBox" class="tag-suggest-popup" style="display:none;"></div>
                    <div id="tagHintLabel" class="tag-hint-text">💡 Заавар: #ai #future #alien эсвэл ?alien гэж бичиж таг үүсгээрэй.</div>
                    <div class="post-footer-actions">
                        <div class="media-buttons">
                            <label for="postImageInput" class="icon-media-btn">📷 Image</label>
                            <input type="file" id="postImageInput" accept="image/*" onchange="previewMedia('image')">
                            <label for="postVideoInput" class="icon-media-btn" style="background:#4facfe;">🎥 Video</label>
                            <input type="file" id="postVideoInput" accept="video/*" onchange="previewMedia('video')">
                        </div>
                        <button id="submitBtn" class="main-post-btn" onclick="createPost()">Post</button>
                    </div>
                    <div id="mediaPreviewBox" class="preview-box-container" style="display:none;">
                        <button class="preview-close-btn" onclick="clearSelectedMedia()">✕</button>
                        <div id="mediaPreviewContent"></div>
                    </div>
                </div>
                <h3 id="myPostsTitle" style="color:var(--accent); margin-bottom:20px;">📌 Миний оруулсан зөгнөлүүд</h3>
                <div id="myPostsContainer"></div>
            </div>

            <div id="page-friends" class="page">
                <h3 id="friendsTitle" style="color:var(--accent); margin-bottom:20px;">👥 Ирээдүйн Хамтрагчид / Friends</h3>
                <div id="friendsListContainer"></div>
            </div>

            <div id="page-chats" class="page">
                <div class="multi-chat-wrapper">
                    <div class="chat-main-window">
                        <div style="margin-bottom: 12px; display:flex; justify-content:space-between; align-items:center;">
                            <label id="chatWithLabel" style="font-weight:bold;"></label>
                            <select id="chatPartner" onchange="loadChats()" style="width:auto; margin:0; padding:5px;"></select>
                        </div>
                        <div class="chat-box">
                            <div class="chat-messages" id="chatMessages"></div>
                            <div class="comment-input-group" style="padding: 10px; background: #121824;">
                                <input type="text" class="comment-input" id="chatInput" onkeydown="handleChatSubmit(event)">
                                <button class="comment-btn" id="chatSendBtn" onclick="sendDirectMessage()"></button>
                            </div>
                        </div>
                    </div>
                    <div class="chat-side-panel">
                        <div class="side-panel-header">🤖 ERR_ID_2040 Core Log</div>
                        <div id="robotSyncPanel" class="sync-glow-card">
                            <div id="robotSyncText">🔮 Ой санамж: 0%</div>
                            <div class="sync-progress-bar"><div id="syncProgressBarFill" class="sync-progress-fill" style="width:0%;"></div></div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="page-profile" class="page">
                <div class="profile-card">
                    <div class="profile-cover-wrapper">
                        <img id="profileCoverImg" class="profile-cover" src="https://placeholder.com" alt="cover">
                    </div>
                    <div class="avatar-container" onclick="triggerAvatarInput()">
                        <img id="profileAvatar" class="avatar" src="https://placeholder.com" alt="avatar">
                        <div class="avatar-overlay">📷</div>
                        <input type="file" id="avatarInput" accept="image/*" style="display:none;" onchange="changeProfileAvatar()">
                    </div>
                    <h2 id="profileName">Sainaa</h2>
                    <p id="profileTitleText" style="color: var(--text-sub);">🔮 Ирээдүйг Зөгнөгч Магистр</p>
                    <button id="editProfileTriggerBtn" class="edit-profile-trigger-btn" onclick="toggleEditOptions()">⚙️ Профайл Тохиргоог Засах</button>
                    <div id="editOptionsPanel" class="edit-profile-panel" style="display:none;">
                        <label id="coverChangeLabel" for="coverInput" class="icon-media-btn" style="margin-top:10px; display:inline-block; cursor:pointer;">📷 Ковер Сэдэв Зургаа Солих</label>
                        <input type="file" id="coverInput" accept="image/*" style="display:none;" onchange="changeCoverTheme()">
                        <div style="margin-top:15px;">
                            <label id="themeSelectLabel" style="font-size:0.85rem; font-weight:bold; color:var(--accent);">🎨 Сайтын үндсэн өнгө: </label>
                            <select id="siteThemeSelect" onchange="applySiteCustomTheme()" style="background:#12161a; color:white; border:1px solid var(--accent); padding:5px; border-radius:6px;">
                                <option value="default">Саарал ба Шар неон</option>
                                <option value="dark-purple">Гүн Нил Ягаан</option>
                                <option value="cyber-blue">Кибер Цэнхэр</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 🧠 ҮНДСЭН СКРИПТ ФАЙЛЫГ ХОЛБОХ ХЭСЭГ -->
    <script src="script.js"></script>

    <!-- 🔒 ХЭРЭГЛЭГЧИЙН ТӨЛӨВ ШАЛГАХ СКРИПТ -->
    <script>
        if (localStorage.getItem('iknow_current_user') || localStorage.getItem('iknow_guest_mode') === 'true') {
            const overlay = document.getElementById('authOverlay');
            if (overlay) overlay.style.display = 'none';
        }
    </script>
</body>
</html>
