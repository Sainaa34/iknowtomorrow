<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iKnowTomorrow - Cyber Timeline</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 🔐 AUTH PAGE (LOGIN / REGISTER) -->
    <div id="auth-container">
        <!-- 🔑 Login Card -->
        <div id="login-card" class="auth-card">
            <h1 id="login-title">iKnowTomorrow</h1>
            <p class="subtitle">🛸 FUTURE CITIZEN LOGIN SYSTEM</p>
            <form onsubmit="handleLogin(event)">
                <input id="login-username" type="text" placeholder="Username" required>
                <input id="login-password" type="password" placeholder="Access Key (Password)" required>
                <button type="submit" class="cyber-btn" id="login-btn-text">LOGIN</button>
            </form>
            <button onclick="showAuthPage('register')" class="toggle-link" id="toggle-reg">Don't have an account? Register here</button>
            <div class="auth-divider">OR</div>
            <button onclick="enterAsGuest()" class="cyber-btn guest" id="guest-btn">Browse as Guest (Anonymous)</button>
        </div>

        <!-- 📝 Register Card -->
        <div id="register-card" class="auth-card" style="display: none;">
            <h1 id="reg-title">Create Account</h1>
            <p class="subtitle">⚡ INITIALIZE NEW TIMELINE IDENTITY</p>
            <form onsubmit="handleRegister(event)">
                <input id="reg-username" type="text" placeholder="Choose Username" required>
                <input id="reg-password" type="password" placeholder="Create Access Key" required>
                <button type="submit" class="cyber-btn" id="reg-btn-text">REGISTER NEW IDENTITY</button>
            </form>
            <button onclick="showAuthPage('login')" class="toggle-link" id="toggle-login">Already have an account? Login here</button>
        </div>
    </div>
    <!-- 🛸 MAIN APPLICATION (CYBER FEED) -->
    <div id="main-app" style="display: none;">
        <header class="cyber-header">
            <div class="header-left">
                <span class="logo-neon">iKnowTomorrow</span>
                <span class="timeline-badge">⚡ ONLINE TIMELINE</span>
            </div>
            <button id="lang-btn" onclick="switchLang()" class="lang-toggle-btn">English</button>
        </header>

        <div class="app-layout">
            <!-- 🎛️ SIDE NAV / PROFILE CONTAINER -->
            <aside class="sidebar">
                <div class="profile-box">
                    <img id="profile-avatar" class="user-avatar-main" src="" alt="avatar">
                    <h3 id="profile-name">Connecting...</h3>
                    <button onclick="openProfileModal()" class="edit-profile-btn" id="profile-btn">Profile Settings</button>
                </div>

                <nav class="side-menu">
                    <button class="menu-tab active" onclick="switchTab('feed')" id="feed-btn">Feed</button>
                    <button class="menu-tab" onclick="switchTab('chat')" id="chats-btn">Chats</button>
                </nav>

                <!-- 🧠 CYBORG MEMORY SYNC STATUS -->
                <div class="sync-container">
                    <h4 id="sync-title">Cyborg Memory Sync</h4>
                    <div class="sync-bar-bg">
                        <div id="sync-fill" class="sync-bar-fill" style="width: 0%;"></div>
                    </div>
                    <span id="sync-level-text">0%</span>
                </div>

                <button onclick="handleLogout()" class="exit-btn-cyber" id="exit-btn">Exit</button>
            </aside>
            <!-- 📰 CENTRAL FEED & CHAT CONTENT -->
            <main class="content-area">
                
                <!-- 🔍 SEARCH & FILTER SECTION -->
                <div class="search-wrapper">
                    <input id="search-input" type="text" placeholder="Search Timeline..." oninput="searchPosts()">
                </div>

                <!-- 📝 POST CREATION ZONE -->
                <div id="tab-feed" class="tab-content">
                    <div class="create-post-box">
                        <textarea id="future-input" placeholder="What will happen in the future? Share here..."></textarea>
                        <div class="post-actions">
                            <div class="media-attach-btns">
                                <button onclick="previewMedia('image')" class="action-mini" id="image-btn">Image</button>
                                <button onclick="previewMedia('video')" class="action-mini" id="video-btn">Video</button>
                            </div>
                            <button onclick="createPost()" class="post-submit-btn" id="post-btn">Post</button>
                        </div>
                    </div>

                    <!-- 🗂️ TRENDING TIMELINE LOGS -->
                    <div id="feed-container"></div>
                </div>

                <!-- 🤖 AI FUTURE BOT CHAT ZONE -->
                <div id="tab-chat" class="tab-content" style="display: none;">
                    <div class="chat-header-box">
                        <h3 id="bot-title">Future Bot 🤖</h3>
                        <p class="bot-desc">Ask anything about the future timeline. Powered by Cyber AI.</p>
                    </div>
                    <div id="chat-container" class="cyber-chat-messages"></div>
                    <div class="chat-input-bar">
                        <input id="bot-input" type="text" placeholder="Ask about the future..." onkeypress="if(event.key === 'Enter') sendDirectMessage()">
                        <button onclick="sendDirectMessage()" class="chat-send-btn" id="send-btn">Send</button>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <!-- 👤 MODAL POPUP FOR PROFILE SETTINGS -->
    <div id="profile-modal" class="cyber-modal-overlay" style="display: none;">
        <div class="cyber-modal-card">
            <h2>Timeline Identity Sync</h2>
            <div class="modal-form-group">
                <label>Cyber Name:</label>
                <input id="modal-username" type="text">
            </div>
            <div class="modal-form-group">
                <label>Avatar URL:</label>
                <input id="modal-avatar" type="text" placeholder="https://image-link.com">
            </div>
            <div class="modal-modal-actions">
                <button onclick="closeProfileModal()" class="modal-btn close">Cancel</button>
                <button onclick="saveProfileModal()" class="modal-btn save">Sync Data</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
