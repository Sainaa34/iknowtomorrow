<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iKnowTomorrow - Cyber Timeline</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-cyber">

    <!-- 🔐 AUTH PAGE (LOGIN / REGISTER) -->
    <div id="auth-container">
        <div id="login-card" class="auth-card">
            <h1>iKnowTomorrow</h1>
            <p class="subtitle">🛸 FUTURE CITIZEN LOGIN SYSTEM</p>
            <form onsubmit="handleLogin(event)">
                <input id="login-username" type="text" placeholder="Username" required>
                <input id="login-password" type="password" placeholder="Access Key (Password)" required>
                <button type="submit" class="cyber-btn">LOGIN</button>
            </form>
            <button onclick="showAuthPage('register')" class="toggle-link">Don't have an account? Register here</button>
            <div class="auth-divider">OR</div>
            <button onclick="enterAsGuest()" class="cyber-btn guest">Browse as Guest</button>
        </div>

        <div id="register-card" class="auth-card" style="display: none;">
            <h1>Create Account</h1>
            <p class="subtitle">⚡ INITIALIZE NEW IDENTITY</p>
            <form onsubmit="handleRegister(event)">
                <input id="reg-username" type="text" placeholder="Choose Username" required>
                <input id="reg-password" type="password" placeholder="Create Access Key" required>
                <button type="submit" class="cyber-btn">REGISTER</button>
            </form>
            <button onclick="showAuthPage('login')" class="toggle-link">Already have an account? Login here</button>
        </div>
    </div>

    <!-- 🛸 MAIN APPLICATION -->
    <div id="main-app" style="display: none;">
        <header class="cyber-header">
            <div class="header-left">
                <span class="logo-neon">iKnowTomorrow</span>
                <span class="timeline-badge">⚡ CYBER FEED</span>
            </div>
            <div class="header-actions">
                <button id="theme-btn" onclick="toggleTheme()" class="theme-toggle-btn">🎨 Theme: Cyber</button>
                <button id="lang-btn" onclick="switchLang()" class="lang-toggle-btn">English</button>
            </div>
        </header>

        <div class="app-layout">
            <!-- 🎛️ SIDE NAV / PROFILE -->
            <aside class="sidebar">
                <div class="profile-box">
                    <img id="profile-avatar" class="user-avatar-main" src="" alt="avatar">
                    <h3 id="profile-name">Connecting...</h3>
                    <!-- 👤 АВАТАР БОЛОН НЭР СОЛИХ ЦОНХЫГ ДУУДАХ МЕНЮ -->
                    <button onclick="openProfileModal()" class="edit-profile-btn">⚙️ Profile Settings</button>
                </div>

                <nav class="side-menu">
                    <button class="menu-tab active" onclick="switchTab('feed')" id="feed-btn">Feed</button>
                    <button class="menu-tab" onclick="switchTab('friends')" id="friends-btn">🤝 Friends & Chats</button>
                    <button class="menu-tab" onclick="switchTab('chat')" id="chats-btn">🤖 Future Bot</button>
                </nav>

                <button onclick="handleLogout()" class="exit-btn-cyber">Exit</button>
            </aside>
            <!-- 📰 CENTRAL FEED & CHAT CONTENT -->
            <main class="content-area">
                
                <!-- 🔍 SEARCH TIMELINE -->
                <div class="search-wrapper">
                    <input id="search-input" type="text" placeholder="Search Timeline..." oninput="searchPosts()">
                </div>

                <!-- 📝 TAB: FEED (ПОСТ ОРУУЛАХ ХЭСЭГ) -->
                <div id="tab-feed" class="tab-content">
                    <div class="create-post-box">
                        <textarea id="future-input" placeholder="What will happen in the future? Share here..."></textarea>
                        <div class="post-actions">
                            <div class="media-attach-btns">
                                <!-- 📎 URL нэхэхгүй, компьютерээс шууд зураг/видео файлаар унших далд талбарууд -->
                                <label class="action-mini">📷 Image <input type="file" id="post-image-file" accept="image/*" style="display:none;" onchange="handleFileSelect(event, 'image')"></label>
                                <label class="action-mini">🎥 Video <input type="file" id="post-video-file" accept="video/*" style="display:none;" onchange="handleFileSelect(event, 'video')"></label>
                                <span id="file-attached-status" style="font-size:11px; color:var(--cyber-cyan);"></span>
                            </div>
                            <button onclick="createPost()" class="post-submit-btn" id="post-btn">Post</button>
                        </div>
                    </div>
                    <!-- Трендинг постууд энд зурагдана -->
                    <div id="feed-container"></div>
                </div>

                <!-- 🤝 TAB: FRIENDS & REAL-TIME CHATS (НАЙЗУУДТАЙГАА ЧАТЛАХ) -->
                <div id="tab-friends" class="tab-content" style="display: none;">
                    <div class="friends-layout">
                        <div class="friends-list-box">
                            <h4>🌍 Online Citizens</h4>
                            <div id="friends-list-container"></div>
                        </div>
                        <div class="friends-chat-box">
                            <h4 id="active-chat-partner">Select a citizen to chat</h4>
                            <div id="friends-chat-messages" class="cyber-chat-messages"></div>
                            <div class="chat-input-bar">
                                <input id="friends-chat-input" type="text" placeholder="Type a message..." onkeypress="if(event.key === 'Enter') sendFriendMessage()">
                                <button onclick="sendFriendMessage()" class="chat-send-btn">Send</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 🤖 TAB: FUTURE BOT (ЭНГИЙН УХААЛАГ AI БОТ) -->
                <div id="tab-chat" class="tab-content" style="display: none;">
                    <div class="chat-header-box">
                        <h3 id="bot-title">Future Bot 🤖</h3>
                        <p class="bot-desc">Ask anything about the future. Real AI Matrix.</p>
                    </div>
                    <div id="chat-container" class="cyber-chat-messages"></div>
                    <div class="chat-input-bar">
                        <input id="bot-input" type="text" placeholder="Ask about the future..." onkeypress="if(event.key === 'Enter') sendDirectMessage()">
                        <button onclick="sendDirectMessage()" class="chat-send-btn" id="send-btn">Send</button>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <!-- 👤 MODAL POPUP FOR PROFILE SETTINGS (ПРОФАЙЛ СОЛИХ ЦОНХ) -->
    <div id="profile-modal" class="cyber-modal-overlay" style="display: none;">
        <div class="cyber-modal-card">
            <h2>Timeline Identity Sync</h2>
            <div class="modal-form-group">
                <label>Cyber Name:</label>
                <input id="modal-username" type="text">
            </div>
            <div class="modal-form-group">
                <label>Avatar URL / File Path:</label>
                <input id="modal-avatar" type="text" placeholder="https://image-link.com">
                <!-- Аватар зургаа компьютерээсээ шууд сонгож оруулах товчлуур -->
                <input type="file" id="avatar-file-input" accept="image/*" style="margin-top:5px; font-size:12px;" onchange="handleAvatarFile(event)">
            </div>
            <div class="modal-modal-actions">
                <button onclick="closeProfileModal()" class="modal-btn close">Cancel</button>
                <button onclick="saveProfileModal()" class="modal-btn save">Sync Data</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
