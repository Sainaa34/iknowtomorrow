<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iKnowTomorrow - Quantum Timeline</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="theme-cyber">

    <div id="auth-container">
        <div id="login-card" class="auth-card">
            <h1>iKnowTomorrow</h1>
            <div class="subtitle">ENTER QUANTUM MATRIX</div>
            <form id="login-form">
                <input type="text" id="login-username" placeholder="Identity Username" required autocomplete="off">
                <div style="position: relative; width: 100%;">
                    <input type="password" id="login-password" placeholder="Matrix Password Access Key" required style="padding-right: 40px;">
                    <i class="fa-solid fa-eye" id="toggleLoginPassword" style="position: absolute; right: 15px; top: 15px; cursor: pointer; color: var(--cyber-cyan);"></i>
                </div>
                <button type="submit" class="cyber-btn">AUTHENTICATE</button>
            </form>
            <button class="toggle-link" onclick="showAuthPage('register')">Initialize New Identity Profile ➔</button>
        </div>

        <div id="register-card" class="auth-card" style="display: none;">
            <h1>Initialize Identity</h1>
            <div class="subtitle">CREATE TIMELINE ANCHOR</div>
            <form id="register-form">
                <input type="text" id="reg-username" placeholder="Choose Username" required autocomplete="off">
                <div style="position: relative; width: 100%;">
                    <input type="password" id="reg-password" placeholder="Create Password Access Key" required style="padding-right: 40px;">
                    <i class="fa-solid fa-eye" id="toggleRegPassword" style="position: absolute; right: 15px; top: 15px; cursor: pointer; color: var(--cyber-cyan);"></i>
                </div>
                <button type="submit" class="cyber-btn">INITIALIZE MATRIX</button>
            </form>
            <button class="toggle-link" onclick="showAuthPage('login')">⬅️ Return to Authentication</button>
        </div>
    </div>

    <div id="main-app" style="display: none;">
        <header class="cyber-header">
            <div class="logo-neon">iKnowTomorrow</div>
            <div class="header-actions">
                <button id="lang-btn" class="lang-toggle-btn" onclick="switchLang()">English</button>
                <button id="theme-btn" class="theme-toggle-btn" onclick="toggleTheme()">🎨 Theme: CYBER</button>
                <button class="exit-top-btn" onclick="handleLogout()">🚪 Exit</button>
            </div>
        </header>

        <div class="app-layout">
            <aside class="sidebar">
                <div class="profile-box">
                    <img id="profile-avatar" class="user-avatar-main" src="Designer.png" alt="Avatar">
                    <h3 id="profile-name">Citizen</h3>
                </div>
                <nav class="side-menu">
                    <button id="feed-btn" class="menu-tab active" onclick="switchTab('feed')">Timeline</button>
                    <button id="chats-btn" class="menu-tab" onclick="switchTab('chat')">🤖 Future Bot</button>
                </nav>
            </aside>

            <main class="main-content">
                <div id="tab-feed" class="tab-content">
                    <div class="create-post-card">
                        <textarea id="future-input" placeholder="What will happen in the future? Share here..."></textarea>
                        <button id="post-btn" class="post-submit-btn" onclick="createPost()">Post</button>
                    </div>
                    <div id="feed-container"></div>
                </div>

                <div id="tab-chat" class="tab-content" style="display: none;">
                    <h2 id="bot-title">Future Bot 🤖</h2>
                    <div id="chat-container" class="chat-messages-box" style="height:350px; background: rgba(0,0,0,0.4); padding: 10px; overflow-y: auto; border-radius: 6px;">
                        <div class="msg-row bot"><strong>Future Bot:</strong> Quantum temporal grid active. Ask me about your tomorrow.</div>
                    </div>
                    <div class="chat-input-row" style="margin-top: 10px; display: flex; gap: 5px;">
                        <input type="text" id="bot-input" placeholder="Query the timeline..." style="flex: 1;">
                        <button id="send-btn" class="chat-send-btn" onclick="sendDirectMessage()">Send</button>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="auth.js"></script>
    <script src="script.js"></script>
</body>
</html>
